<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cadastrar / Editar Filme</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body.dark-mode {
            background-color: #121212;
            color: #ffffff;
        }
        body.dark-mode a {
            color: #bb86fc;
        }
    </style>
</head>

<body>
    <div style="text-align: right; padding: 10px;">
        <button id="btn-tema">Mudar Tema (Claro/Escuro)</button>
    </div>

    <h1 th:text="${filme.id != null} ? 'Editar Filme' : 'Cadastrar novo filme'">Cadastrar novo filme</h1>

    <form id="form-filme" th:object="${filme}">
        <input type="hidden" id="id" th:field="*{id}">

        <div>
            <label for="titulo">Título:</label>
            <input type="text" id="titulo" th:field="*{titulo}" required>
        </div>
        <br>
        <div>
            <label for="sinopse">Sinopse:</label>
            <textarea id="sinopse" th:field="*{sinopse}" required></textarea>
        </div>
        <br>
        <div>
            <label for="genero">Gênero:</label>
            <input type="text" id="genero" th:field="*{genero}" required>
        </div>
        <br>
        <div>
            <label for="anoLancamento">Ano de lançamento:</label>
            <input type="number" id="anoLancamento" th:field="*{anoLancamento}" required>
        </div>
        <br>

        <button type="submit" th:text="${filme.id != null} ? 'Salvar Alterações' : 'Cadastrar filme'">Cadastrar filme</button>
    </form>

    <br>
    <a href="/filmes">Voltar para a lista de filmes</a>

    <script>
        function setCookie(nome, valor, dias) {
            var d = new Date();
            d.setTime(d.getTime() + (dias * 24 * 60 * 60 * 1000));
            document.cookie = nome + "=" + valor + ";expires=" + d.toUTCString() + ";path=/";
        }

        function getCookie(nome) {
            var nameEQ = nome + "=";
            var ca = document.cookie.split(';');
            for(var i = 0; i < ca.length; i++) {
                var c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        $(document).ready(function() {
            if (getCookie("tema_preferido") === "dark") {
                $('body').addClass('dark-mode');
            }

            $('#btn-tema').click(function() {
                $('body').toggleClass('dark-mode');
                if ($('body').hasClass('dark-mode')) {
                    setCookie("tema_preferido", "dark", 30);
                } else {
                    setCookie("tema_preferido", "light", 30);
                }
            });

            $('#form-filme').submit(function(event) {
                event.preventDefault();

                var filmeId = $('#id').val();
                var dadosFilme = {
                    titulo: $('#titulo').val(),
                    sinopse: $('#sinopse').val(),
                    genero: $('#genero').val(),
                    anoLancamento: $('#anoLancamento'].val()
                };

                var tipoRequisicao = filmeId ? 'PUT' : 'POST';
                var urlRequisicao = filmeId ? '/api/filmes/' + filmeId : '/api/filmes';

                $.ajax({
                    url: urlRequisicao,
                    type: tipoRequisicao,
                    contentType: 'application/json',
                    data: JSON.stringify(dadosFilme),
                    success: function(response) {
                        alert('Filme salvo com sucesso!');
                        window.location.href = '/filmes';
                    },
                    error: function(error) {
                        alert('Erro ao salvar o filme.');
                        console.log(error);
                    }
                });
            });
        });
    </script>
</body>
</html>
